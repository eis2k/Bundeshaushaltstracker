# Amtliche Gesamtausgaben des Kernhaushalts je Jahr (Soll, letzter Stand inkl. Nachträge), in Euro.
# Unabhängige Prüfgröße für die Pipeline: weicht die Titelsumme um mehr als `toleranz` ab,
# bricht der Build ab. Werte wie amtlich veröffentlicht (auf 100 Mio gerundet), Quelle je Jahr
# der Gesamtplan bzw. das Haushaltsgesetz im Download-Portal von bundeshaushalt.de.
toleranz: 100000000
jahre:
  2015:
    ausgaben_kern: 306900000000   # inkl. 1. Nachtrag 2015 (Grundhaushalt: 299,1 Mrd)
    quelle: {dokument: "Haushaltsplan 2015 und Nachtragshaushalt 2015", url: "https://www.bundeshaushalt.de/static/daten/2015/soll/Haushaltsplan-2015.pdf"}
  2016:
