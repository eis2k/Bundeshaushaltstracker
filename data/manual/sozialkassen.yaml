# Einnahmen und Ausgaben der Sozialversicherungen (Töpfe neben dem Bundeshaushalt), in Euro.
# Stufe 1: grobe Gliederung, Stützjahre 2015, 2020, 2024, 2025. Fehlende Jahre interpoliert die Pipeline
# linear und markiert sie als geschaetzt. Jeder Wert trägt seine Quelle; abgeleitete Werte sind markiert.
#
# bundesmittel: Verweise auf Titel des Bundeshaushalts (IDs der Build-Daten), damit ein Regler im Bund
# die Einnahmen des Topfs verändert. Die Beträge der Bundesmittel kommen zur Laufzeit aus dem Bund.
#
# Quellen (Kurzzeichen):
#   DRV-ZR  Deutsche Rentenversicherung, "Rentenversicherung in Zeitreihen", Oktober 2025, S. 238–243,
#           https://www.deutsche-rentenversicherung.de/SharedDocs/Downloads/DE/Statistiken-und-Berichte/statistikpublikationen/rv_in_zeitreihen.pdf
#   DRV-KZ  DRV, "Kennzahlen zur Finanzentwicklung" (Rechnungsjahre 2024/2025),
#           https://www.deutsche-rentenversicherung.de/DRV/DE/Experten/Zahlen-und-Fakten/Kennzahlen-zur-Finanzentwicklung/kennzahlen-zur-finanzentwicklung_node
#   KJ1     BMG, Gesetzliche Krankenversicherung, Endgültige Rechnungsergebnisse (Statistik KJ 1), Spalte "BUND" (alle Kassen),
#           https://www.bundesgesundheitsministerium.de/themen/krankenversicherung/zahlen-und-fakten-zur-krankenversicherung/finanzergebnisse.html
#   SPV     BMG, "Die Finanzentwicklung der sozialen Pflegeversicherung, Ist-Ergebnisse 1995–2025",
#           https://www.bundesgesundheitsministerium.de/fileadmin/Dateien/3_Downloads/Statistiken/Pflegeversicherung/Finanzentwicklung/03-Finanzentwicklung-der-sozialen-Pflegeversicherung__2025.pdf
#   BA-GB   Bundesagentur für Arbeit, Geschäftsberichte 2015 / 2025, Finanzentwicklungsberichte 2020 / 2024,
#           https://www.arbeitsagentur.de/ueber-uns/veroeffentlichungen/berichte-und-haushalt
#   BA-JR   Bundesagentur für Arbeit, Jahresrechnung 2020 / 2024 (statistik.arbeitsagentur.de)
quellen:
  DRV-ZR: {dokument: "Deutsche Rentenversicherung: Rentenversicherung in Zeitreihen, Oktober 2025, S. 238–243", url: "https://www.deutsche-rentenversicherung.de/SharedDocs/Downloads/DE/Statistiken-und-Berichte/statistikpublikationen/rv_in_zeitreihen.pdf"}
  DRV-KZ: {dokument: "Deutsche Rentenversicherung: Kennzahlen zur Finanzentwicklung (Rechnungsjahre 2024/2025)", url: "https://www.deutsche-rentenversicherung.de/DRV/DE/Experten/Zahlen-und-Fakten/Kennzahlen-zur-Finanzentwicklung/kennzahlen-zur-finanzentwicklung_node"}
  KJ1: {dokument: "Bundesministerium für Gesundheit: Gesetzliche Krankenversicherung, Endgültige Rechnungsergebnisse (KJ 1), Spalte alle Kassen", url: "https://www.bundesgesundheitsministerium.de/themen/krankenversicherung/zahlen-und-fakten-zur-krankenversicherung/finanzergebnisse.html"}
  SPV: {dokument: "Bundesministerium für Gesundheit: Die Finanzentwicklung der sozialen Pflegeversicherung, Ist-Ergebnisse 1995–2025", url: "https://www.bundesgesundheitsministerium.de/fileadmin/Dateien/3_Downloads/Statistiken/Pflegeversicherung/Finanzentwicklung/03-Finanzentwicklung-der-sozialen-Pflegeversicherung__2025.pdf"}
  BA-GB: {dokument: "Bundesagentur für Arbeit: Geschäftsberichte 2015 und 2025, Finanzentwicklungsberichte 2020 und 2024", url: "https://www.arbeitsagentur.de/ueber-uns/veroeffentlichungen/berichte-und-haushalt"}
  BA-JR: {dokument: "Bundesagentur für Arbeit: Jahresrechnung 2020 und 2024", url: "https://statistik.arbeitsagentur.de/DE/Navigation/Statistiken/Fachstatistiken/Einnahmen-Ausgaben/Einnahmen-Ausgaben-Nav.html"}
