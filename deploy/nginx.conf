# nginx-Konfiguration für den Bundeshaushaltstracker (statische Seite).
# Ablage auf dem VPS: /etc/nginx/sites-available/bundeshaushaltstracker, dann
#   ln -s /etc/nginx/sites-available/bundeshaushaltstracker /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d <domain> (ergänzt den Server-Block um Zertifikat und Weiterleitung).

server {
    listen 80;
    listen [::]:80;
    server_name _;   # Domain eintragen, z. B. bundeshaushaltstracker.de www.bundeshaushaltstracker.de

    root /var/www/bundeshaushaltstracker;
    index index.html;

    # Vorkomprimierte Dateien ausliefern, falls vorhanden (vite build erzeugt sie nicht; optional per gzip -k)
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_static on;

    # Datenpaket der Pipeline: lange cachen, Dateinamen ändern sich nicht, Inhalt nur bei neuem Build
    location /data/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Gebündelte Assets tragen einen Hash im Namen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Seite selbst kurz cachen; Zustand steckt im URL-Hash, daher kein Routing nötig
    location / {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ /index.html;
    }

    # Kein Tracking: Zugriffsprotokolle nach 7 Tagen löschen (logrotate), IP-Adressen nicht auswerten
    access_log /var/log/nginx/bundeshaushaltstracker.access.log;
    error_log  /var/log/nginx/bundeshaushaltstracker.error.log;
}
