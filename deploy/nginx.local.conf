# nginx im lokalen Docker-Container (deploy/Dockerfile). Die VPS-Konfiguration für später liegt in deploy/nginx.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css text/html image/svg+xml;
    gzip_min_length 1024;

    # Daten der Pipeline: JSON, kurz gecacht (ändert sich mit jedem Build)
    location /data/ {
        types { application/json json; }
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Vite-Assets tragen einen Hash im Namen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
