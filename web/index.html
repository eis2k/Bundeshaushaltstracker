<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bundeshaushaltstracker: Dem Geld des Bundes folgen, von der Steuer bis zum Empfänger, 2015 bis 2026. Haushalt umbauen, Wirkung sehen, Ergebnis teilen." />
    <title>Bundeshaushaltstracker</title>
    <script>
      // Gespeicherte Darstellung vor dem ersten Zeichnen anwenden (kein Aufblitzen); Schlüssel wie in src/lib/model/theme.ts
      try { var t = localStorage.getItem("bht-theme"); if (t === "dunkel") document.documentElement.dataset.theme = "dark"; else if (t === "hell") document.documentElement.dataset.theme = "light"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
