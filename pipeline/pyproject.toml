[project]
name = "bhtracker"
version = "0.1.0"
description = "Pipeline des Bundeshaushaltstrackers: lädt, prüft und verdichtet die amtlichen Haushaltsdaten"
authors = [
    { name = "eis2k", email = "fmoeller2010@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
bht = "bhtracker.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
